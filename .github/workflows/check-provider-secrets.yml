name: Comprobar secretos de proveedores
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Verificar solo nombres de secretos (nunca valores)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          found = [name for name in ('GROQ', 'NVIDIA', 'OPENROUTER', 'MISTRAL', 'CEREBRAS', 'SAMBANOVA') if os.getenv(name + '_API_KEY')]
          print('PROVEEDORES_CON_CLAVE=' + (','.join(found) if found else 'NINGUNO'))
          PY
