name: Router CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: docker build -t router-ci .
      - name: Isolated Docker HTTP acceptance (no network or provider keys)
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,size=32m \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e ROUTER_OFFLINE_ONLY=1 \
            -e ROUTER_SERVICE_TOKEN=ci-offline-only-token \
            -e ROUTER_DB_FILE=/tmp/router-ci.db \
            -e ROUTER_CATALOG_FILE=/tmp/router-ci-catalog.json \
            --entrypoint python router-ci -c '
          from fastapi.testclient import TestClient
          from router.api import app

          with TestClient(app) as client:
              assert client.get("/health").status_code == 200
              request = {"task": "estado de obras", "application_name": "gestion-obras-ute", "decompose": False}
              assert client.post("/route", json=request).status_code == 401
              auth = {"Authorization": "Bearer ci-offline-only-token"}
              response = client.post("/route", headers=auth, json=request)
              assert response.status_code == 200, response.text
              result = response.json()
              assert result["ok"] is False, result
              assert result["error"] == "no_eligible_provider", result
              assert result["attempts"] == [], result
              assert result["text"] is None, result
              completion = client.post("/v1/chat/completions", headers=auth, json={
                  "messages": [{"role": "user", "content": "hola"}],
                  "stream": False,
              })
              assert completion.status_code == 502, completion.text
          print("offline_container_http_acceptance=passed")
          '
