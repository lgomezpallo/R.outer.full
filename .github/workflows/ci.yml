name: Router CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: docker build -t router-ci .
      - name: Real G.O. client + Router loopback acceptance (network disabled)
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,size=32m \
            --mount type=bind,src="$PWD/tests/fixtures/go_ute_router_5823272.py",dst=/tmp/go_ute_router.py,readonly \
            --mount type=bind,src="$PWD/scripts/go_ute_http_acceptance_offline.py",dst=/tmp/acceptance.py,readonly \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e ROUTER_OFFLINE_ONLY=1 \
            -e ROUTER_SERVICE_TOKEN=ci-offline-only-token \
            -e ROUTER_DB_FILE=/tmp/router-ci.db \
            -e ROUTER_CATALOG_FILE=/tmp/router-ci-catalog.json \
            --entrypoint python router-ci /tmp/acceptance.py
