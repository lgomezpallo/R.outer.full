name: Router Oracle isolated reconciliation from encrypted snapshot

on:
  push:
    branches: [feat/offline-cooldown-restart-consistency-20261028]
    paths:
      - .github/workflows/oracle-candidate-reconcile.yml
      - scripts/oracle_snapshot_bridge.py
      - scripts/oracle_method_three_way.py
      - scripts/oracle_symbol_merge.py
      - scripts/check_stage8_offline_workflows.py
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: router-oracle-candidate-snapshot
  cancel-in-progress: false

jobs:
  preserve-and-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover previously encrypted Oracle snapshot without contacting Oracle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo "::error::Missing existing SSH recovery key"; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/oracle-encrypted"
          gh run download 40853340673 -R "$GITHUB_REPOSITORY" \
            -n oracle-local-encrypted-40853340673 \
            -D "$RUNNER_TEMP/oracle-encrypted"
          SNAP_PASS="$( { printf 'router-oracle-snapshot-v1\n'; printf '%s\n' "$SSH_KEY"; } | sha256sum | cut -d' ' -f1)"
          export SNAP_PASS
          python3 - "$RUNNER_TEMP/oracle-encrypted" <<'PY'
          import hashlib, hmac, os, pathlib, sys
          directory = pathlib.Path(sys.argv[1])
          ciphertext = directory / 'oracle-local-changes.enc'
          macfile = directory / 'oracle-local-changes.enc.hmac'
          expected = macfile.read_text().strip()
          actual = hmac.new(bytes.fromhex(os.environ['SNAP_PASS']), ciphertext.read_bytes(), hashlib.sha256).hexdigest()
          if not hmac.compare_digest(expected, actual):
              raise SystemExit('encrypted snapshot integrity verification failed')
          print('oracle_snapshot_hmac=verified')
          PY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -pass env:SNAP_PASS \
            -in "$RUNNER_TEMP/oracle-encrypted/oracle-local-changes.enc" \
            -out "$RUNNER_TEMP/oracle-snapshot-for-reconcile.tar"
          unset SNAP_PASS SSH_KEY
          echo 'oracle_snapshot=reused_prior_encrypted_backup'
          echo 'oracle_ssh_connection=no'
          echo 'oracle_production_modified=no'
      - name: Reconcile tracked changes in runner-only disposable worktrees
        shell: bash
        env:
          ROUTER_RECONCILE_PATCH_PATH: ${{ runner.temp }}/oracle-merged.patch
        run: |
          set -euo pipefail
          python3 scripts/oracle_snapshot_bridge.py reconcile \
            "$RUNNER_TEMP/oracle-snapshot-for-reconcile.tar" "$GITHUB_SHA"
      - name: Stage verified tracked Oracle reconciliation on the candidate branch only
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/oracle-merged.patch" || { echo "::error::No merged patch"; exit 1; }
          git apply --check "$RUNNER_TEMP/oracle-merged.patch"
          git apply --index "$RUNNER_TEMP/oracle-merged.patch"
          python3 - <<'PY'
          import pathlib, re, subprocess
          paths = [p.decode('utf-8') for p in subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', '-z']).split(b'\0') if p]
          if not paths or any(not re.fullmatch(r'router/[A-Za-z0-9_/-]+\.py', p) for p in paths):
              raise SystemExit('blocked: reconciled changes outside reviewed Router Python sources')
          patch = pathlib.Path(__import__('os').environ['RUNNER_TEMP'], 'oracle-merged.patch').read_text()
          added = '\n'.join(line[1:] for line in patch.splitlines()
                            if line.startswith('+') and not line.startswith('+++'))
          sensitive = (
              r'-----BEGIN [A-Z ]*PRIVATE KEY-----',
              r'(?i)(?:sk-[A-Za-z0-9_-]{20,}|gsk_[A-Za-z0-9_-]{20,}|nvapi-[A-Za-z0-9_-]{20,})',
              r'(?i)(?:api[_-]?key|password|secret|access[_-]?token)\s*[:=]\s*["\x27][A-Za-z0-9_+/=-]{20,}',
          )
          if any(re.search(pattern, added) for pattern in sensitive):
              raise SystemExit('blocked: possible credential in reconciled source')
          print('merged_source_files=' + ','.join(paths))
          print('source_secret_pattern_check=passed')
          PY
          git diff --cached --check >/dev/null 2>&1 || echo 'merged_source_whitespace_warning=yes'
          python3 -m compileall -q router
          echo "merged_source_syntax=passed"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(router): reconcile preserved Oracle tracked source into PR 87"
          git fetch origin feat/offline-cooldown-restart-consistency-20261028
          git rebase origin/feat/offline-cooldown-restart-consistency-20261028
          git push origin "HEAD:refs/heads/feat/offline-cooldown-restart-consistency-20261028"
          echo "candidate_branch_source_reconciliation=pushed_pending_full_CI"
      - name: Erase decrypted and encrypted runner copies
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/oracle-merged.patch" "$RUNNER_TEMP/oracle-snapshot-for-reconcile.tar" "$RUNNER_TEMP/oracle-encrypted/oracle-local-changes.enc" "$RUNNER_TEMP/oracle-encrypted/oracle-local-changes.enc.hmac"
