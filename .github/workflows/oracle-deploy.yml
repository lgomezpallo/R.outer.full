name: Router Oracle Deploy (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Inspect, preserve local changes, or deploy'
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - snapshot
          - compare
          - reconcile-check
          - deploy

permissions:
  contents: read

concurrency:
  group: router-oracle-production
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check SSH configuration
        env:
          SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS" || {
            echo "::error::Configure ORACLE_SSH_HOST, ORACLE_SSH_USER, ORACLE_SSH_PRIVATE_KEY, ORACLE_SSH_KNOWN_HOSTS first."
            exit 1
          }
      - name: Preflight and optionally deploy only when Oracle checkout is clean
        env:
          SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
          DEPLOY_MODE: ${{ inputs.mode }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/router_oracle
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/router_oracle ~/.ssh/known_hosts
          ssh -i ~/.ssh/router_oracle -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "DEPLOY_MODE=$DEPLOY_MODE bash -se" <<'REMOTE'
          set -euo pipefail
          APP=/home/ubuntu/Proyecto/Herramientas/Router
          cd "$APP"
          case "$DEPLOY_MODE" in
            preflight|snapshot|compare|reconcile-check|deploy) ;;
            *) echo "BLOCKED: invalid or missing deployment mode."; exit 2 ;;
          esac
          git fetch origin main
          echo "Oracle commit: $(git rev-parse --short HEAD)"
          echo "GitHub commit: $(git rev-parse --short origin/main)"
          echo "Tracked modifications: $(git status --porcelain --untracked-files=no | wc -l)"
          if test "$DEPLOY_MODE" = snapshot; then
            # Keep all sensitive patches and snapshots on Oracle, never in public CI logs.
            umask 077
            SNAP="$HOME/router-local-snapshot-$(date +%Y%m%d-%H%M%S)-$RANDOM"
            mkdir -m 700 "$SNAP"
            git rev-parse HEAD > "$SNAP/oracle_commit"
            git rev-parse origin/main > "$SNAP/github_commit"
            git status --porcelain=v1 > "$SNAP/status.txt"
            git diff --binary HEAD -- > "$SNAP/local-tracked.patch"
            git diff --name-only HEAD -z | tar --null -T - -cf "$SNAP/modified-tracked.tar"
            if test -f tests/test_vision.py; then cp -p tests/test_vision.py "$SNAP/test_vision.py"; fi
            if test -f router.db; then
              python3 -c 'import sqlite3,sys; src=sqlite3.connect("file:router.db?mode=ro",uri=True); dst=sqlite3.connect(sys.argv[1]); src.backup(dst); dst.close(); src.close()' "$SNAP/router.db"
            fi
            echo "Snapshot saved privately on Oracle: $SNAP"
            echo "Tracked files saved: $(git diff --name-only HEAD | wc -l)"
            echo "Repository and service unchanged."
            exit 0
          fi
          if test "$DEPLOY_MODE" = compare; then
            echo "=== Changed paths on Oracle (names only) ==="
            git diff --name-only
            echo "=== Changed paths on GitHub since Oracle HEAD (names only) ==="
            git diff --name-only HEAD origin/main
            echo "=== Paths changed on both sides ==="
            comm -12 <(git diff --name-only | sort) <(git diff --name-only HEAD origin/main | sort) || true
            echo "=== Local change size (no content) ==="
            git diff --stat
            echo "=== GitHub commit ancestry ==="
            git rev-list --left-right --count HEAD...origin/main
            echo "Comparison complete: no source, secrets, database, or service modified."
            exit 0
          fi
          if test "$DEPLOY_MODE" = reconcile-check; then
            # Candidate is isolated; the private patch never leaves Oracle.
            git show origin/main:scripts/oracle_reconcile.sh | ROUTER_APP_DIR="$APP" bash
            exit 0
          fi
          if test "$DEPLOY_MODE" = preflight; then
            echo "Preflight complete; no deployment performed."
            exit 0
          fi
          # Fail closed if Oracle contains any local tracked modifications.
          # Never overwrite experimental work with a remote deploy.
          if test -n "$(git status --porcelain --untracked-files=no)"; then
            echo "BLOCKED: tracked Oracle changes exist. Resolve and preserve them before deploying."
            git status --short
            exit 2
          fi
          OLD=$(git rev-parse HEAD)
          test "$(git rev-list --left-right --count HEAD...origin/main | awk '{print $1}')" = 0 || {
            echo "BLOCKED: Oracle branch diverged from GitHub main."
            exit 3
          }
          test "$(systemctl is-active router.service)" = active
          BACKUP="$HOME/router-deploy-backup-$(date +%Y%m%d-%H%M%S)"
          mkdir -p "$BACKUP"
          git rev-parse HEAD > "$BACKUP/previous_commit"
          # Back up the working directory's runtime database if present.
          if test -f router.db; then cp -p router.db "$BACKUP/router.db"; fi
          git merge --ff-only origin/main
          if ! (.venv/bin/python -m compileall -q router && sudo -n systemctl restart router.service && sleep 8 && curl -fsS --max-time 15 http://127.0.0.1:8010/health | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'); then
            echo "Health check failed: rolling back source and service."
            git reset --hard "$OLD"
            # Do not overwrite live DB: SQLite migrations may not be reversible.
            sudo -n systemctl restart router.service || true
            exit 4
          fi
          echo "Router deployed: $(git rev-parse --short HEAD)"
          REMOTE
