name: Oracle SSH read-only access check
on:
  push:
    branches: [main, fix/router-oracle-p2-readonly-20261101]
    paths:
      - .github/workflows/oracle-ssh-readonly-access.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Router service without changing Oracle
        env:
          SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          for value in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS; do
            test -n "${!value}" || { echo "::error::Missing required SSH setting: $value"; exit 1; }
          done
          umask 077
          mkdir -m 700 -p ~/.ssh
          trap 'rm -f ~/.ssh/router_oracle ~/.ssh/known_hosts' EXIT
          printf '%s\n' "$SSH_KEY" > ~/.ssh/router_oracle
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/router_oracle ~/.ssh/known_hosts
          ssh -i ~/.ssh/router_oracle -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            "$SSH_USER@$SSH_HOST" 'python3 -' <<'PY'
          import pathlib, re, shlex, subprocess
          app = pathlib.Path('/home/ubuntu/Proyecto/Herramientas/Router')
          releases = pathlib.Path.home() / 'router-releases'
          pin = '3377e3088c5249a0662aa05870eba18886d4f4e7'
          sha_pattern = re.compile(r'[0-9a-f]{40}\Z')
          def read(*cmd):
              try:
                  p = subprocess.run(cmd, capture_output=True, text=True, timeout=12)
                  return p.stdout.strip() if p.returncode == 0 and len(p.stdout) < 65536 else None
              except (OSError, subprocess.SubprocessError, UnicodeError):
                  return None
          def prop(key):
              return read('systemctl', 'show', 'router.service', '-p', key, '--value')
          def commit(root):
              try:
                  if not root.is_dir() or root.is_symlink(): return None
                  top = read('git', '-C', str(root), 'rev-parse', '--show-toplevel')
                  if top is None or pathlib.Path(top).resolve(strict=True) != root.resolve(strict=True): return None
                  sha = read('git', '-C', str(root), 'rev-parse', 'HEAD')
                  return sha if sha and sha_pattern.fullmatch(sha) else None
              except (OSError, ValueError):
                  return None
          def category(path):
              if not path: return 'missing'
              p = pathlib.Path(path)
              if not p.is_absolute(): return 'relative'
              if p == app or app in p.parents: return 'router_checkout'
              if releases in p.parents: return 'router_release'
              return 'external'
          active = prop('ActiveState')
          if active not in ('active', 'inactive', 'failed', 'activating', 'deactivating'):
              print('inspection_blocked=service_status_unavailable')
              raise SystemExit(2)
          print('inspection_version=1')
          print('service_state=' + active)
          print('checkout_sha=' + (commit(app) or 'unverified'))
          target = releases / pin
          if not target.exists() and not target.is_symlink():
              status = 'missing'
          elif target.is_symlink() or not target.is_dir():
              status = 'invalid'
          else:
              actual = commit(target)
              status = 'invalid' if actual is None else ('match' if actual == pin else 'mismatch')
          print('frozen_3377_worktree=' + status)
          print('service_workdir_kind=' + category(prop('WorkingDirectory')))
          raw = prop('ExecStart') or ''
          match = re.search(r'argv\[\]=(.*?)\s+;\s+ignore_errors=', raw)
          try:
              argv = shlex.split(match.group(1)) if match else []
          except ValueError:
              argv = []
          print('exec_record=' + ('parsed' if argv else 'unparseable'))
          launcher = pathlib.Path(argv[0]) if argv else None
          name = launcher.name if launcher else ''
          kind = 'python' if name.startswith('python') else ('uvicorn' if name == 'uvicorn' else 'other')
          print('exec_launcher_kind=' + (category(str(launcher)) + '_' + kind if launcher else 'unparseable'))
          if launcher and name == 'uvicorn':
              try:
                  with launcher.open('rb') as handle: line = handle.readline(256)
                  shebang = line[2:].decode('utf-8').strip().split(' ', 1)[0] if line.startswith(b'#!') else ''
                  shebang_kind = category(shebang) + ('_python' if pathlib.Path(shebang).name.startswith('python') else '_other') if shebang else 'unverified'
              except (OSError, UnicodeError):
                  shebang_kind = 'unverified'
          else:
              shebang_kind = 'not_uvicorn_launcher'
          print('exec_shebang_kind=' + shebang_kind)
          print('exec_argument_count=' + str(len(argv)))
          i = argv.index('--app-dir') if argv.count('--app-dir') == 1 else -1
          source = pathlib.Path(argv[i + 1]) if i >= 0 and i + 1 < len(argv) else None
          if source and not source.is_absolute(): source = app / source
          print('exec_app_dir_kind=' + category(str(source) if source else None))
          print('exec_app_dir_sha=' + ((commit(source) if source else None) or 'unverified'))
          print('exec_router_application=' + ('yes' if 'router.api:app' in argv else 'no'))
          print('exec_loopback_8010=' + ('yes' if '--host' in argv and '--port' in argv and argv.index('--host') + 1 < len(argv) and argv.index('--port') + 1 < len(argv) and argv[argv.index('--host') + 1] == '127.0.0.1' and argv[argv.index('--port') + 1] == '8010' else 'no'))
          print('exec_reload=' + ('yes' if '--reload' in argv else 'no'))
          drops = prop('DropInPaths')
          if drops is None:
              print('dropins=unverified')
              print('frozen_release_dropin=unverified')
          else:
              try: paths = shlex.split(drops)
              except ValueError: paths = []
              print('dropins=' + str(len(paths)))
              print('frozen_release_dropin=' + ('present' if any(pathlib.Path(p).name == 'zzzz-router-frozen-release.conf' for p in paths) else 'absent'))
          env = prop('Environment')
          offline = env is not None and bool(re.search(r'(?:^|\s)ROUTER_OFFLINE_ONLY=1(?:\s|$)', env))
          print('offline_flag=' + ('explicit_on' if offline or 'ROUTER_OFFLINE_ONLY=1' in argv else ('unverified' if env is None else 'not_explicit_envfile_unread')))
          print('envfiles_configured=' + ('unverified' if prop('EnvironmentFiles') is None else 'checked_without_values'))
          print('inspection_complete=' + ('yes' if argv else 'partial'))
          if not argv: raise SystemExit(2)
          PY
