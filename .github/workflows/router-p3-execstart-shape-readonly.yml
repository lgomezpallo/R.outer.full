name: Router P3 nested ExecStart shape (read-only)
on:
  push:
    branches: [fix/router-p3-execstart-rehearsal-20261101]
    paths:
      - .github/workflows/router-p3-execstart-shape-readonly.yml
  # No workflow_dispatch and no main trigger.
permissions:
  contents: read
jobs:
  nested-launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Classify only the inner launcher; never print argv or environment
        env:
          SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          for key in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS; do
            test -n "${!key}" || { echo "::error::missing_ssh_setting"; exit 1; }
          done
          umask 077
          mkdir -p -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/router_oracle ~/.ssh/known_hosts' EXIT
          printf '%s\n' "$SSH_KEY" > ~/.ssh/router_oracle
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/router_oracle ~/.ssh/known_hosts
          ssh -i ~/.ssh/router_oracle -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            "$SSH_USER@$SSH_HOST" 'python3 -' <<'PY'
          import pathlib, re, shlex, subprocess
          app = pathlib.Path('/home/ubuntu/Proyecto/Herramientas/Router')
          releases = pathlib.Path.home() / 'router-releases'
          try:
              result = subprocess.run(
                  ['systemctl', 'show', 'router.service', '-p', 'ExecStart', '--value'],
                  capture_output=True, text=True, timeout=12,
              )
              if result.returncode or len(result.stdout) > 65536:
                  raise ValueError('unavailable')
              match = re.search(r'argv\[\]=(.*?)\s+;\s+ignore_errors=', result.stdout)
              args = shlex.split(match.group(1)) if match else []
              if len(args) != 12:
                  raise ValueError('unverified')
              print('p3_shape_args=12')
              if args[0] != '/usr/bin/env':
                  print('p3_wrapper=not_verified_env')
                  print('p3_shape_complete=no')
                  raise SystemExit(0)
              print('p3_wrapper=env')
              i, keys = 1, {}
              while i < len(args) and '=' in args[i]:
                  k, v = args[i].split('=', 1)
                  if k in keys: raise ValueError('duplicate')
                  keys[k] = v
                  i += 1
              expected = {'ROUTER_OFFLINE_ONLY', 'ROUTER_DB_FILE', 'ROUTER_CATALOG_FILE'}
              print('p3_env_keys_exact=' + ('yes' if set(keys) == expected else 'no'))
              print('p3_offline_explicit=' + ('yes' if keys.get('ROUTER_OFFLINE_ONLY') == '1' else 'no'))
              print('p3_data_paths_absolute=' + ('yes' if all(
                  pathlib.Path(keys.get(k, '')).is_absolute()
                  for k in ('ROUTER_DB_FILE', 'ROUTER_CATALOG_FILE')
              ) else 'no'))
              inner = pathlib.Path(args[i]) if i < len(args) else None
              if inner is None:
                  kind = 'missing'
              elif inner == app / '.venv/bin/uvicorn':
                  kind = 'checkout_uvicorn'
              elif inner == app / '.venv/bin/python':
                  kind = 'checkout_python'
              elif inner.name == 'uvicorn' and releases in inner.parents:
                  kind = 'release_uvicorn'
              elif inner.name.startswith('python') and releases in inner.parents:
                  kind = 'release_python'
              else:
                  kind = 'other'
              print('p3_inner_kind=' + kind)
              if inner is not None and inner.name == 'uvicorn':
                  try:
                      with inner.open('rb') as handle:
                          line = handle.readline(256)
                      expected_shebang = '#!' + str(inner.parent / 'python')
                      shebang_ok = line.decode('utf-8').strip() == expected_shebang
                  except (OSError, UnicodeError):
                      shebang_ok = False
                  print('p3_pip_shebang=' + ('expected' if shebang_ok else 'unverified'))
              else:
                  print('p3_pip_shebang=not_applicable')
              print('p3_canonical_python_executable=' + ('yes' if (
                  (app / '.venv/bin/python').is_file()
                  and (app / '.venv/bin/python').stat().st_mode & 0o111
              ) else 'no'))
              print('p3_shape_complete=yes')
          except (OSError, ValueError, IndexError, subprocess.SubprocessError):
              print('p3_shape_complete=no')
              raise SystemExit(2)
          PY
