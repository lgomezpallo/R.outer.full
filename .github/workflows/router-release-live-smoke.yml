name: Live-provider smoke of frozen Router release (no deployment)

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: router-oracle-production
  cancel-in-progress: false

jobs:
  tests:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'lgomezpallo' && github.event.before == 'bed145eb7513b6259dfb0d45e37ec3dadacc549f' && startsWith(github.event.head_commit.message, 'Router isolated free-model live smoke gate') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare offline test wheels and Docker base
        run: |
          mkdir -p wheelhouse
          python -m pip download --dest wheelhouse ".[dev]" "setuptools>=69" wheel
          docker pull python:3.12-slim
      - name: Install from local wheelhouse
        run: python -m pip install --no-index --find-links=wheelhouse -e ".[dev]"
      - run: pytest -q
      - name: Build Docker without network
        run: docker build --network none --pull=false --build-arg ROUTER_OFFLINE_WHEELS=1 -t router-live-smoke-ci .
      - name: Verify isolated G.O. HTTP contract without network
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,size=32m \
            --mount type=bind,src="$PWD/tests/fixtures/go_ute_router_5823272.py",dst=/tmp/go_ute_router.py,readonly \
            --mount type=bind,src="$PWD/scripts/go_ute_http_acceptance_offline.py",dst=/tmp/acceptance.py,readonly \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e ROUTER_OFFLINE_ONLY=1 \
            -e ROUTER_SERVICE_TOKEN=ci-offline-only-token \
            -e ROUTER_DB_FILE=/tmp/router-ci.db \
            -e ROUTER_CATALOG_FILE=/tmp/router-ci-catalog.json \
            --entrypoint python router-live-smoke-ci /tmp/acceptance.py

  oracle-live-smoke:
    # Exactly one reviewed main merge; short-lived isolated inference only.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'lgomezpallo' && github.event.before == 'bed145eb7513b6259dfb0d45e37ec3dadacc549f' && startsWith(github.event.head_commit.message, 'Router isolated free-model live smoke gate') }}
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: router-production
    steps:
      - uses: actions/checkout@v4
      - name: Test real provider chat and controlled fallback against isolated release
        env:
          SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
          SCRIPT_SHA: ${{ github.sha }}
          RELEASE_SHA: 3377e3088c5249a0662aa05870eba18886d4f4e7
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          [[ "$SCRIPT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          umask 077
          mkdir -m 700 -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/router_oracle
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/router_oracle ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/router_oracle' EXIT
          ssh -i ~/.ssh/router_oracle -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "ROUTER_SCRIPT_SHA=$SCRIPT_SHA ROUTER_RELEASE_SHA=$RELEASE_SHA bash -se" <<'REMOTE'
          set -euo pipefail
          umask 077
          cd /home/ubuntu/Proyecto/Herramientas/Router
          git fetch --quiet origin main
          git cat-file -e "$ROUTER_SCRIPT_SHA:scripts/router_release_live_smoke.py"
          mkdir -p -m 700 "$HOME/router-private-backups"
          SCRIPT="$(mktemp "$HOME/router-private-backups/router-live-script-XXXXXXXX.py")"
          trap 'rm -f "$SCRIPT"' EXIT
          git show "$ROUTER_SCRIPT_SHA:scripts/router_release_live_smoke.py" > "$SCRIPT"
          chmod 600 "$SCRIPT"
          python3 "$SCRIPT" orchestrate
          REMOTE
