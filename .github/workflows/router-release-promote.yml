name: Promote frozen Router release with automatic rollback

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact previously staged release SHA (not the workflow commit)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: router-oracle-production
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Dependency/image acquisition happens only in this explicit runner
      # preparation step. The Docker build and HTTP acceptance have no network.
      - name: Prepare local wheels and Docker base image
        run: |
          mkdir -p wheelhouse
          python -m pip download --dest wheelhouse ".[dev]" "setuptools>=69" wheel
          docker pull python:3.12-slim
      - name: Install dependencies from local wheelhouse
        run: python -m pip install --no-index --find-links=wheelhouse -e ".[dev]"
      - run: pytest -q
      - name: Build Docker with network disabled
        run: docker build --network none --pull=false --build-arg ROUTER_OFFLINE_WHEELS=1 -t router-release-promote-ci .
      - name: Verify G.O. HTTP contract without network
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,size=32m \
            --mount type=bind,src="$PWD/tests/fixtures/go_ute_router_5823272.py",dst=/tmp/go_ute_router.py,readonly \
            --mount type=bind,src="$PWD/scripts/go_ute_http_acceptance_offline.py",dst=/tmp/acceptance.py,readonly \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e ROUTER_OFFLINE_ONLY=1 \
            -e ROUTER_SERVICE_TOKEN=ci-offline-only-token \
            -e ROUTER_DB_FILE=/tmp/router-ci.db \
            -e ROUTER_CATALOG_FILE=/tmp/router-ci-catalog.json \
            --entrypoint python router-release-promote-ci /tmp/acceptance.py

  oracle-promote:
    # Explicit dispatch only, exact staged SHA only. No automatic production trigger.
    # The release script still forces offline/no egress and performs rollback.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_sha == '96cae21106abdd15cba19195374b116892c58008' }}
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Switch only the pinned release using a reversible systemd drop-in
        env:
          SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
          SCRIPT_SHA: 96cae21106abdd15cba19195374b116892c58008
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          [[ "$SCRIPT_SHA" =~ ^[0-9a-f]{40}$ ]]
          umask 077
          mkdir -m 700 -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/router_oracle
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/router_oracle ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/router_oracle' EXIT
          ssh -i ~/.ssh/router_oracle -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "ROUTER_SCRIPT_SHA=$SCRIPT_SHA ROUTER_RELEASE_SHA=$SCRIPT_SHA bash -se" <<'REMOTE'
          set -euo pipefail
          umask 077
          cd /home/ubuntu/Proyecto/Herramientas/Router
          git fetch --quiet origin main
          git cat-file -e "$ROUTER_SCRIPT_SHA:scripts/router_release_promote.py"
          mkdir -p -m 700 "$HOME/router-private-backups"
          SCRIPT="$(mktemp "$HOME/router-private-backups/router-promote-script-XXXXXXXX.py")"
          trap 'rm -f "$SCRIPT"' EXIT
          git show "$ROUTER_SCRIPT_SHA:scripts/router_release_promote.py" > "$SCRIPT"
          chmod 600 "$SCRIPT"
          python3 "$SCRIPT" promote
          REMOTE
