[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "router-ia"
version = "1.0.0"
description = "Router de IA desacoplado, auditable y tolerante a fallas."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "cryptography>=43,<47"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"


[tool.setuptools.package-data]
router = ["static/*"]
